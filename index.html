<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Soal AI Reader - CBT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app" class="light-mode">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <h1>Bank Soal AI Reader</h1>
            </div>
                <button id="btn-report" class="btn btn-secondary" style="margin-right: 1rem;">
                    <i class="fas fa-chart-bar"></i> Report Validasi
                </button>
                <select id="block-select" class="block-select">
                    <option value="">Pilih Blok Soal</option>
                </select>
                <button id="theme-toggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Report Modal -->
        <div id="report-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fas fa-chart-pie"></i> Report Validasi PDF AI</h2>
                    <span id="close-modal" class="close-btn">&times;</span>
                </div>
                <div class="modal-body">
                    <div id="stats-container">Memuat data...</div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Loading Screen -->
            <div id="loading" class="loading-container hidden">
                <div class="spinner"></div>
                <p>Memuat soal...</p>
            </div>

            <!-- Quiz Container -->
            <div id="quiz-container" class="quiz-container hidden">
                
                <!-- Progress Bar -->
                <div class="progress-section">
                    <div class="progress-info">
                        <span id="question-counter">Soal 1 dari 10</span>
                        <span id="progress-percentage">10%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                </div>

                <!-- Question Area -->
                <div class="question-area">
                    <div class="question-header">
                        <h2 id="question-number">Soal 1</h2>
                    </div>
                    <div id="question-text" class="question-text"></div>
                    <div id="question-image-container" class="question-image-container hidden">
                        <img id="question-image" src="" alt="Gambar Soal">
                    </div>
                </div>

                <!-- Options Area -->
                <div id="options-container" class="options-container">
                    <!-- Options injected here by JS -->
                </div>

                <!-- Feedback Area -->
                <div id="feedback-container" class="feedback-container hidden">
                    <p id="feedback-message" class="feedback-message"></p>
                </div>

                <!-- Navigation -->
                <div class="navigation-area">
                    <button id="btn-prev" class="btn btn-secondary" disabled>
                        <i class="fas fa-arrow-left"></i> Sebelumnya
                    </button>
                    <button id="btn-next" class="btn btn-primary hidden">
                        Selanjutnya <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state">
                <i class="fas fa-file-pdf"></i>
                <h2>Selamat Datang di CBT AI Reader</h2>
                <p>Silakan pilih blok soal pada menu di atas untuk memulai simulasi ujian.</p>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
